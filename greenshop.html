<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GreenShop</title>
    <link rel="stylesheet" href="styles/reset.css" />
    <link rel="stylesheet" href="styles/style.css" />
  </head>
  <body class="container">
    <header>
      <div class="header-info">
        <div class="header-logo">
          <a href="#">
            <img src="images/logo-greenshop.svg" alt="logo-greenshop" />
          </a>
        </div>
        <nav class="header-nav">
          <ul class="header-nav_list">
            <li><a class="active" href="#">Home</a></li>
            <li><a href="#">Shop</a></li>
            <li><a href="#">Plant Care</a></li>
            <li><a href="#">Blogs</a></li>
          </ul>
        </nav>
        <div class="btn">
          <img src="images/logout.svg" alt="button-login" />
          <a
            href="https://0lasonova.github.io/Homework3/greenshop.html?"
            target="_blank"
            class="btn-logout"
            >Login</a
          >
        </div>
      </div>
      <hr class="hr_header-info" />
    </header>
    <main>
      <section class="banner">
        <div class="banner-text">
          <h6>Welcome to Greenshop</h6>
          <h1>
            Let’s Make a <br />
            Better <span class="banner-text-h1word">Planet</span>
          </h1>
          <p>
            We are an online plant shop offering a wide range of cheap and
            trendy plants. Use our plants to create an unique Urban Jungle. 
            Order your favorite plants!
          </p>
          <div class="btn">
            <a>Shop now</a>
          </div>
        </div>
        <div class="banner-pic">
          <img
            class="banner-pic-min"
            src="images/main-img.png"
            alt="main-img"
          />
        </div>
      </section>
      </div>
    </main>
  </body>
</html>
